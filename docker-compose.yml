services:
  api:
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  app-network:
    driver: bridge
