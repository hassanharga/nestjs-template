# Optional local observability stack. Use with docker-compose.yml.
services:
  api:
    environment:
      FEATURE_MONITORING: 'true'

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting monitoring}
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - app-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.1
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - app-network
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
