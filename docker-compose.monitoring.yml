# Optional development-only observability. Production uses an external collector.
services:
  api:
    environment:
      FEATURE_MONITORING: 'true'
      FEATURE_TELEMETRY: 'true'
      OTEL_SERVICE_NAME: nestjs-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      lgtm:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.40.0@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
      - '127.0.0.1:${OTLP_PORT:-4318}:4318'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting monitoring}
      API_METRICS_TARGET: api:3000
      OTELCOL_EXTRA_ARGS: --config=file:/etc/otelcol/template-metrics.yaml
    volumes:
      - telemetry-data:/data
      - ./docker/telemetry/collector.yaml:/etc/otelcol/template-metrics.yaml:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - app-network
    stop_grace_period: 20s

volumes:
  telemetry-data:
